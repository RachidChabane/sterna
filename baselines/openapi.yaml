          description: No response body
  /api/auth/github/:
    post:
      operationId: auth_github_create
      description: |-
        Authenticate user with GitHub OAuth code.

        Expected request body:
        {
            "code": "Authorization code from GitHub"
        }
      tags:
      - auth
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: Authenticate user with a Google OAuth ID token.
      tags:
      - auth
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/google/one-tap/:
    post:
      operationId: auth_google_one_tap_create
      description: |-
        Handle Google One Tap authentication.
        This is similar to google_auth but specifically for One Tap flow.

        Calls the shared implementation directly (NOT the decorated
        ``google_auth`` view — passing a DRF ``Request`` back through
        ``@api_view`` raises an AssertionError) and shares the same
        ``oauth-callback`` rate-limit bucket as the other two callbacks.
      tags:
      - auth
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: User login endpoint.
      tags:
      - auth
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: User logout endpoint.
      tags:
