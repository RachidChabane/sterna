  /api/audit/logs/:
    get:
      operationId: audit_logs_list
      description: |-
        ViewSet for viewing audit logs.

        Provides endpoints for:
        - Listing audit logs with filtering
        - Viewing individual audit log entries
        - Getting statistics
        - Searching logs
        - Generating reports
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - audit
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogListList'
          description: ''
  /api/audit/logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: |-
        ViewSet for viewing audit logs.

        Provides endpoints for:
        - Listing audit logs with filtering
        - Viewing individual audit log entries
        - Getting statistics
        - Searching logs
        - Generating reports
      parameters:
      - in: path
