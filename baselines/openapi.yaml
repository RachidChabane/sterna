      description: |-
        Create a file version (called by orchestrator after file operations).

        This endpoint enables immediate versioning for file tool operations,
        without waiting for workspace sync.

        Expected payload:
        {
            "user_id": "uuid",
            "chat_id": "uuid",
            "path": "src/main.py",
            "content_base64": "...",
            "source_type": "file_tool",
            "source_message_id": "uuid" (optional),
            "source_job_id": "job_123" (optional),
            "source_tool_name": "Write" (optional),
            "is_deleted": false (optional)
        }

        Returns:
        {
            "success": true,
            "version": { ...version metadata... }
        }
      tags:
      - workspaces
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/workspaces/versions/create-batch/:
    post:
      operationId: workspaces_versions_create_batch_create
      description: |-
        Create multiple file versions in a batch (used during workspace sync).

        Expected payload:
        {
            "user_id": "uuid",
            "chat_id": "uuid",
            "source_type": "coding_agent",
            "source_job_id": "cc_abc123" (optional),
            "files": [
                {
                    "path": "src/main.py",
                    "content_base64": "...",
                    "source_tool_name": "Write" (optional),
                    "is_deleted": false (optional)
                }
            ]
        }
      tags:
      - workspaces
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /share/{token}/:
    get:
      operationId: share_retrieve
      description: |-
        Public share page for viewing shared assets.

        Returns an HTML page with:
        - Open Graph meta tags for rich social previews
        - Twitter Card meta tags
        - Embedded image/video viewer
        - Attribution to the AI model used

        For social media crawlers, returns minimal HTML with OG tags.
        For browsers, returns full interactive page.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - share
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /share/{token}/raw/:
    get:
      operationId: share_raw_retrieve
      description: |-
        Direct asset access for shared links.

        Used by:
        - Social media crawlers fetching the og:image/og:video
        - Embedded players
        - Direct download/view

        Returns the actual binary content with appropriate headers.
        For images with watermark enabled, applies the watermark before serving.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - share
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    ActionCategoryEnum:
      enum:
      - AUTH
      - PROJECT
      - DATASET
      - EVALUATION
      - RUBRIC
      - USER
      - PERMISSION
      - SYSTEM
      - API
      - EXPORT
      - IMPORT
      - CONFIG
      type: string
      description: |-
        * `AUTH` - Authentication
        * `PROJECT` - Project Management
        * `DATASET` - Dataset Operations
        * `EVALUATION` - Evaluations
        * `RUBRIC` - Rubrics
        * `USER` - User Management
        * `PERMISSION` - Permissions
        * `SYSTEM` - System Operations
        * `API` - API Access
        * `EXPORT` - Data Export
        * `IMPORT` - Data Import
        * `CONFIG` - Configuration
    AgentPlan:
      type: object
      description: Serializer for agent plans.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
          description: Human-readable plan title
        slug:
          type: string
          readOnly: true
          description: URL-safe slug for plan file
          pattern: ^[-a-zA-Z0-9_]+$
        task_description:
          type: string
          readOnly: true
          description: Original task description from user
        plan_content:
          type: string
          readOnly: true
          description: Full markdown plan content
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF27Enum'
          readOnly: true
          description: |-
            Current plan status

            * `creating` - Creating
            * `ready` - Ready for Approval
            * `in_progress` - In Progress
            * `completed` - Completed
            * `failed` - Failed
        current_step_index:
          type: integer
          readOnly: true
          description: Index of currently executing step
        total_steps:
          type: integer
          readOnly: true
          description: Total number of steps in plan
        planning_job_id:
          type: string
          readOnly: true
          description: Coding agent job ID for planning phase
        implementation_job_id:
          type: string
          readOnly: true
          description: Coding agent job ID for implementation phase
        github_issue_number:
          type: integer
          readOnly: true
          nullable: true
          description: GitHub issue number this plan addresses
        github_issue_url:
          type: string
          format: uri
          readOnly: true
          description: Full URL to the GitHub issue
        github_issue_title:
          type: string
          readOnly: true
          description: Title of the GitHub issue
        implementation_branch:
          type: string
          readOnly: true
          description: Git branch created for implementation
        chat_id:
          type: string
          format: uuid
          nullable: true
          description: Chat this plan belongs to
          readOnly: true
        source_plan_id:
          type: string
          format: uuid
          nullable: true
          description: Original plan this was imported from
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PlanStep'
          readOnly: true
        progress:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - chat_id
      - created_at
      - current_step_index
      - github_issue_number
      - github_issue_title
      - github_issue_url
      - id
      - implementation_branch
      - implementation_job_id
      - plan_content
      - planning_job_id
      - progress
      - slug
      - source_plan_id
      - status
      - steps
      - task_description
      - title
      - total_steps
      - updated_at
    AgentPlanSummary:
