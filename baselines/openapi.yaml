      description: Change password endpoint for authenticated users.
      tags:
      - auth
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/consent/:
    get:
      operationId: auth_consent_retrieve
