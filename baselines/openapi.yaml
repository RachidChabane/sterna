          description: ''
  /api/audit/logs/{id}/resource_logs/:
    get:
      operationId: audit_logs_resource_logs_retrieve
      description: |-
        Get all audit logs for a specific resource.

        The pk should be in the format: {content_type_id}:{resource_id}
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - audit
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/audit/logs/failed_actions/:
    get:
      operationId: audit_logs_failed_actions_retrieve
      description: |-
        Get failed action logs.

        Query parameters:
        - start_date: Start of date range (ISO format)
        - end_date: End of date range (ISO format)
        - action_category: Category to filter by
        - limit: Maximum number of logs to return (default 100)
      tags:
      - audit
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/audit/logs/generate_report/:
    post:
      operationId: audit_logs_generate_report_create
      description: |-
        Generate an audit report.

        Request body:
        {
            "start_date": "2024-01-01T00:00:00Z",
            "end_date": "2024-01-31T23:59:59Z",
            "format": "json"
        }
      tags:
      - audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLog'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuditLog'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuditLog'
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/audit/logs/my_activity/:
    get:
      operationId: audit_logs_my_activity_retrieve
      description: |-
        Get current user's activity logs.

