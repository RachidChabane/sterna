      description: ViewSet for managing audit log retention policies.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Audit Log Retention Policy.
        required: true
      tags:
      - audit
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/audit/retention-policies/{id}/apply_policy/:
    post:
      operationId: audit_retention_policies_apply_policy_create
      description: Manually apply a retention policy.
      parameters:
