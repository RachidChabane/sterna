  /api/auth/account/delete-request/cancel/:
    post:
      operationId: auth_account_delete_request_cancel_create
      description: |-
        POST /api/auth/account/delete-request/cancel

        body: { "token": "<one-shot JWT>" }
      tags:
      - auth
      security:
      - Bearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/avatar/{user_id}/:
    get:
      operationId: auth_avatar_retrieve
      description: |-
        Serve user avatar image.

        This endpoint bypasses CORS issues with presigned R2 URLs by proxying
        the image through the backend. The image is fetched from R2 and returned
        with proper cache headers.

        Args:
            user_id: UUID of the user

        Returns:
            Image binary with appropriate Content-Type header
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/change-password/:
    post:
