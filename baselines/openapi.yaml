    MCPServer:
      type: object
      description: |-
        Serializer for MCPServer model.

        SECURITY NOTE: auth_config and env_vars are intentionally EXCLUDED from serialization
        to prevent OAuth tokens and secrets from being exposed in API responses.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Human-readable name for this server
          maxLength: 200
        description:
          type: string
          description: Optional description of what this server provides
        icon_url:
          type: string
          format: uri
          nullable: true
          description: URL for the server icon (for display in UI)
          maxLength: 200
        is_preconfigured:
          type: boolean
          description: Whether this is a system-wide preconfigured server (not user-created)
        is_official:
          type: boolean
          description: Whether this is an official MCP server from the service provider
            (False = community/unofficial)
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          description: |-
            Category for grouping servers in the UI

            * `productivity` - Productivity & Collaboration
            * `developer` - Developer Tools
            * `cloud` - Cloud & Infrastructure
            * `crm` - CRM & Sales
            * `finance` - Finance & Payments
            * `ai` - AI & Knowledge
            * `data` - Data & Analytics
            * `communication` - Communication & Social
            * `automation` - Automation & Integration
            * `design` - Design & Creative
            * `ecommerce` - E-commerce
            * `utilities` - Utilities & Tools
            * `other` - Other
        transport_type:
          allOf:
          - $ref: '#/components/schemas/TransportTypeEnum'
          description: |-
            Transport protocol to use

            * `websocket` - WebSocket
            * `stdio` - Standard I/O
            * `http` - HTTP/SSE (Remote)
            * `sandboxed` - Sandboxed NPM
        server_type:
          type: string
          readOnly: true
        url:
          type: string
          description: WebSocket URL (required for websocket transport)
          format: uri
          maxLength: 500
        npm_package:
          type: string
          description: NPM package name (e.g., '@modelcontextprotocol/server-github').
            Required for stdio transport.
          maxLength: 200
        command:
          type: string
          description: Command to run for stdio transport (legacy, use npm_package
            instead)
          maxLength: 500
        working_directory:
          type: string
          description: Working directory for stdio process
          maxLength: 500
        allowed_domains:
          description: Custom domains to allow for network egress (in addition to
            defaults like npm registry)
        remote_url:
          type: string
          format: uri
          nullable: true
          description: URL for remote MCP servers (HTTP/SSE transport)
          maxLength: 200
        auth_type:
          allOf:
          - $ref: '#/components/schemas/AuthTypeEnum'
          description: |-
            Authentication type for remote servers

            * `none` - No Auth
            * `api_key` - API Key
            * `bearer` - Bearer Token
            * `oauth` - OAuth 2.0
        auth_header_name:
          type: string
          description: HTTP header name for authentication (e.g., Authorization, X-API-Key)
          maxLength: 100
        has_auth:
          type: string
          readOnly: true
        has_env_vars:
          type: string
          readOnly: true
        env_var_keys:
          type: string
          readOnly: true
        connection_id:
          type: string
          readOnly: true
        is_active:
          type: boolean
          description: Whether this server is currently enabled
        connection_healthy:
          type: boolean
          readOnly: true
          description: Whether the last health check was successful
        last_connected:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Last successful connection timestamp
        last_health_check:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Last health check attempt timestamp
        last_error:
          type: string
          readOnly: true
          description: Last connection error message
        connection_status:
          type: string
          readOnly: true
        oauth_connection_status:
          type: string
          readOnly: true
        tools_count:
          type: string
          readOnly: true
        tools:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - connection_healthy
      - connection_id
      - connection_status
      - created_at
      - env_var_keys
      - has_auth
      - has_env_vars
      - id
      - last_connected
