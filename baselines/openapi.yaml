openapi: 3.0.3
info:
  title: Sterna API
  version: 1.0.0
  description: Multi-model AI chat platform API
paths:
  /api/admin/users/{user_id}/plan/:
    post:
      operationId: admin_users_plan_create
      description: |-
        Reassign a user's subscription plan.

        Idempotent: the same input twice → second call no-ops.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: admin_users_plan_update
      description: |-
        Reassign a user's subscription plan.

        Idempotent: the same input twice → second call no-ops.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/apps/:
    get:
      operationId: apps_list
      description: |-
        API endpoints for App management.

        list: List apps (latest version per spark) for the authenticated user.
        retrieve: Get a single app with full details.
        start_preview: Start the dev server for an app.
        stop_preview: Stop the dev server for an app.
        preview_status: Check if the dev server is running.
        versions: List all versions of an app's spark.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - apps
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppListList'
          description: ''
  /api/apps/{id}/:
    get:
      operationId: apps_retrieve
      description: |-
        API endpoints for App management.

        list: List apps (latest version per spark) for the authenticated user.
        retrieve: Get a single app with full details.
        start_preview: Start the dev server for an app.
        stop_preview: Stop the dev server for an app.
        preview_status: Check if the dev server is running.
        versions: List all versions of an app's spark.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - apps
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
          description: ''
  /api/apps/{id}/preview_status/:
    get:
      operationId: apps_preview_status_retrieve
      description: Check if the dev server is running for this app.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - apps
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
          description: ''
  /api/apps/{id}/start_preview/:
    post:
      operationId: apps_start_preview_create
      description: Start the dev server for this app.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - apps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/App'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/App'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/App'
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
          description: ''
  /api/apps/{id}/stop_preview/:
    post:
      operationId: apps_stop_preview_create
      description: Stop the dev server. Looks up the running port server-side.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - apps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/App'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/App'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/App'
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
          description: ''
  /api/apps/{id}/versions/:
    get:
      operationId: apps_versions_retrieve
      description: List all versions of this app's spark.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - apps
      security:
      - Bearer: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
          description: ''
