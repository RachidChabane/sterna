<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <title>Sterna</title>

    <!-- Visual Settings Script - Prevent FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        var root = document.documentElement;

        // ===== THEME =====
        var theme = 'system';
        try {
          var storedTheme = localStorage.getItem('sterna-theme');
          if (storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system') {
            theme = storedTheme;
          }
        } catch (e) {}

        var getSystemTheme = function() {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
        var effectiveTheme = theme === 'system' ? getSystemTheme() : theme;

        if (effectiveTheme === 'light') {
          root.classList.add('light');
          root.classList.remove('dark');
        } else {
          root.classList.add('dark');
          root.classList.remove('light');
        }

        // ===== VISUAL SETTINGS (font size, reduce motion, high contrast) =====
        try {
          var visualSettings = localStorage.getItem('sterna-visual-settings');
          if (visualSettings) {
            var settings = JSON.parse(visualSettings);

            // Font size
            if (settings.fontSize) {
              var scale = settings.fontSize === 'small' ? 0.875 : settings.fontSize === 'large' ? 1.125 : 1;
              root.style.setProperty('--settings-font-scale', scale);
              root.style.fontSize = (scale * 100) + '%';
              root.dataset.fontSize = settings.fontSize;
            }

            // Reduce motion
            if (settings.reduceMotion) {
              root.classList.add('reduce-motion');
              root.dataset.reduceMotion = 'true';
            }

            // High contrast
            if (settings.highContrast) {
              root.classList.add('high-contrast');
              root.dataset.highContrast = 'true';
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Splash Screen Detection - Hide if already loaded in this session -->
    <script>
      (function() {
        // Check if app was already loaded in this session
        const alreadyLoaded = sessionStorage.getItem('sterna-loaded');

        // Check if this is a hard refresh (Ctrl+R, F5)
        const isHardRefresh = performance.navigation && performance.navigation.type === 1;

        // Hide splash screen if already loaded AND not a hard refresh
        if (alreadyLoaded && !isHardRefresh) {
          // Set style immediately before DOM renders to prevent flash
          document.addEventListener('DOMContentLoaded', function() {
            const splash = document.getElementById('splash-screen');
            if (splash) {
              splash.style.display = 'none';
            }
          });
        }
      })();
    </script>

    <!-- Splash Screen Styles -->
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #10121a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s ease-out;
      }

      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .splash-logo {
        width: 120px;
        height: 120px;
        animation: logoEntry 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes logoEntry {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        60% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .splash-logo svg {
        width: 100%;
        height: 100%;
      }

      .splash-text {
        margin-top: 2rem;
        font-size: 1.5rem;
        font-weight: 600;
        color: #ffffff;
        opacity: 0;
        animation: textEntry 0.8s ease-out 0.4s forwards;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
      }

      @keyframes textEntry {
        to {
          opacity: 1;
        }
      }

      .splash-loader {
        margin-top: 2rem;
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
        opacity: 0;
        animation: loaderEntry 0.6s ease-out 0.6s forwards;
      }

      @keyframes loaderEntry {
        to {
          opacity: 1;
        }
      }

      .splash-loader::after {
        content: '';
        display: block;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ffffff, transparent);
        animation: loaderSlide 1.5s ease-in-out infinite;
      }

      @keyframes loaderSlide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="splash-logo">
        <svg viewBox="60 40 260 290" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(0,370) scale(0.1,-0.1)" fill="#ffffff" stroke="none">
            <path d="M2490 3079 c-126 -8 -314 -38 -431 -68 -184 -47 -330 -124 -426 -224 -56 -58 -108 -139 -101 -156 3 -8 73 -67 213 -181 194 -157 513 -431 548 -469 78 -86 140 -203 162 -305 l6 -28 28 44 c66 103 180 158 394 189 45 6 88 15 96 19 8 4 -21 16 -72 28 -128 32 -206 74 -285 151 -81 80 -133 107 -244 128 -194 36 -243 64 -274 155 -63 191 120 431 444 585 98 46 312 123 344 123 10 0 18 5 18 10 0 12 -245 11 -420 -1z"/>
            <path d="M818 3034 c-7 -6 17 -160 43 -269 40 -172 125 -370 222 -515 60 -89 242 -275 347 -352 41 -30 131 -94 200 -142 186 -128 246 -181 295 -255 78 -119 96 -254 47 -364 -19 -44 -115 -157 -133 -157 -4 0 6 30 22 66 39 85 48 178 25 255 -14 51 -112 217 -121 207 -2 -2 0 -33 5 -68 21 -150 -58 -320 -224 -485 -118 -117 -313 -243 -515 -332 l-76 -34 50 7 c683 88 1214 397 1320 768 24 84 17 268 -14 347 -27 70 -84 159 -142 220 -65 69 -310 270 -976 801 -126 100 -260 210 -299 244 -39 35 -74 61 -76 58z"/>
          </g>
        </svg>
      </div>
      <div class="splash-text">Sterna</div>
      <div class="splash-loader"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
