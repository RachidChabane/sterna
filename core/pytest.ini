[pytest]
DJANGO_SETTINGS_MODULE = sterna.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    audit_logging
    authentication
    api
    code_sessions
    consigliere
    conversations
    documentation
    llm
    mcp
    notifications
    seed
    sterna
    storage
    support
    usage_quota
    voice_rooms
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    --reuse-db
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    django_db: mark test to use django test database
    smoke: marks tests run only against a deployed URL (requires SMOKE_BASE_URL)
    golden: marks golden SSE transcript tests