<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>We received your request</title></head>
<body style="font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <h2 style="color: #0d9488;">We got your message</h2>
  <p>Hi {{ email }},</p>
  <p>Thanks for reaching out. We received your support request and will get back to you within 1–2 business days.</p>
  <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">
  <p style="font-size: 14px; color: #6b7280;"><strong>Subject:</strong> {{ subject }}</p>
  <p style="font-size: 14px; color: #6b7280; white-space: pre-wrap;">{{ message }}</p>
  <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">
  <p style="font-size: 12px; color: #9ca3af;">— The Sterna team</p>
</body>
</html>
