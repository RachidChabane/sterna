{% load i18n %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ brand_name }}</title>
</head>
<body style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f7fb;color:#1a1a1a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f7fb;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border-radius:8px;padding:32px;max-width:560px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px 0;font-size:20px;font-weight:600;">{{ brand_name }}</h1>
              {% block content %}{% endblock %}
              <p style="margin-top:32px;font-size:12px;color:#6b7280;">
                {% blocktrans %}Need help? Reply to this email or contact {% endblocktrans %}<a href="mailto:{{ support_email }}" style="color:#2563eb;">{{ support_email }}</a>.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
