[pytest]
# Pytest configuration for FastAPI user preferences service

# Test paths
testpaths = tests

# Python files
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Disable Django plugin (this is a FastAPI service, not Django)
addopts = -p no:django -v --tb=short

# Show summary of all test outcomes
console_output_style = progress
