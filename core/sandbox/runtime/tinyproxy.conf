# Tinyproxy configuration for sandbox egress filtering
# Only allow access to whitelisted domains

User proxyuser
Group proxyuser

Port 8888
Listen 0.0.0.0

Timeout 600

# Logging
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info

# PID file
PidFile "/tmp/tinyproxy.pid"

# Maximum number of clients
MaxClients 100

# Allow requests from sandbox network and Docker bridge
Allow 172.16.0.0/12
Allow 127.0.0.1
Allow 10.0.0.0/8

# Domain whitelist - DENY all except allowed domains
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowed-domains.txt"

# Anonymous headers (privacy)
DisableViaHeader Yes

# Reverse only (set to No for forward proxy)
ReverseOnly No

# Connect port (for HTTPS CONNECT method)
ConnectPort 443
