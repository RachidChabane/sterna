# Ruff configuration for the core/ tree.
#
# CI's blocking Lint job runs `ruff check .` (ruff 0.8.6, pinned) from this
# directory. Only per-file ignores are declared here so ruff's default rule
# selection (E4/E7/E9/F) stays in effect for everything else.
#
# Note: core/api-gateway/ has its own pyproject.toml with a stricter rule set;
# ruff uses the closest config, so that subtree is unaffected by this file.

# Metadata only — this tree is a Django application run in place (manage.py),
# not a package built or published via [build-system]/setuptools (no such
# table is declared here, and nothing in CI or the Docker build runs `pip
# install .` against this directory). The [project] table below exists
# solely to record the license that applies to this code, matching the
# root LICENSE/NOTICE and the `license = {text = "..."}` spelling used by
# the other pyproject.toml file in this repo (core/api-gateway).
# `version` is set to a fixed placeholder, not derived from
# core/versions.json, since this table is never built.
[project]
name = "sterna-web"
version = "0.0.0"
license = {text = "AGPL-3.0-only"}

[tool.ruff.lint.per-file-ignores]
# Django settings modules: `from .base import *` plus section-local imports
# after config assignments are the established settings idiom (E402/F403/F405).
"sterna/settings/*.py" = ["E402", "F403", "F405"]
# Standalone Django settings module for the consigliere microservice —
# same settings idiom (section-local imports after config assignments).
"consigliere/settings_service.py" = ["E402"]
# ASGI entrypoint must initialize Django (get_asgi_application) before
# importing the websocket routing modules that touch the ORM.
"sterna/asgi.py" = ["E402"]
# Monkey-patches langchain_openai's streaming chunk converter at import time;
# the patch must be installed before importing the tool modules that use it.
"llm/langchain_agent.py" = ["E402"]
