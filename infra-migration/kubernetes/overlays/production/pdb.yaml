  namespace: sterna
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: orchestrator

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflare-tunnel-pdb
  namespace: sterna
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
