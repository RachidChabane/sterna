# =============================================================================
# imagePullSecrets patch — staging overlay
# =============================================================================
# The deploy workflow rewrites the `__SECRET_NAME__` placeholder below
# to either `scaleway-registry` (legacy Scaleway path) or `ghcr-registry`
# (new Hetzner path) before `kubectl apply`. See
# `.github/workflows/deploy-staging.yml` step "Patch imagePullSecrets to
# match target registry".
#
# Keeping a single `imagePullSecrets` entry avoids
# `FailedToRetrieveImagePullSecret` events that would otherwise fire
# whenever the unused secret is missing.
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: __SECRET_NAME__
