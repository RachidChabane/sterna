apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-preferences
  namespace: sterna
  labels:
    app: user-preferences
    app.kubernetes.io/name: user-preferences
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-preferences
  template:
    metadata:
      labels:
        app: user-preferences
    spec:
      serviceAccountName: user-preferences
      containers:
        - name: user-preferences
          image: ghcr.io/sterna-ai/user-preferences:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DATABASE_URL
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: CORS_ALLOWED_ORIGINS
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_SECRET_KEY
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: observability-secrets
                  key: SENTRY_DSN_USER_PREFS
                  optional: true
          envFrom:
            - configMapRef:
                name: common-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
