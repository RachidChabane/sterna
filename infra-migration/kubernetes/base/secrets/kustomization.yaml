apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# SECRETS ARE NOW MANAGED VIA EXTERNAL SECRETS OPERATOR
# =============================================================================
#
# This directory is NO LONGER used for secrets in the main kustomization.
# Secrets are now managed via:
#   - Scaleway Secret Manager (stores the actual secrets)
#   - External Secrets Operator (syncs secrets to Kubernetes)
#
# See: kubernetes/base/external-secrets/
#   - secret-store.yaml    - SecretStore connecting to Scaleway
#   - external-secrets.yaml - ExternalSecret definitions
#
# The secrets-template.yaml is kept for reference/documentation only.
# =============================================================================

resources: []
