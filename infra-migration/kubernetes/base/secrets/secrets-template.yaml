# =============================================================================
# Kubernetes Secrets Template for Sterna
# =============================================================================
#
# IMPORTANT: This file is a TEMPLATE. Do NOT commit actual secrets!
#
# To use:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Fill in the actual values (base64 encoded)
# 3. Apply: kubectl apply -f secrets.yaml -n sterna
#
# To base64 encode a value:
#   echo -n "your-value" | base64
#
# Or use kubectl to create secrets directly:
#   kubectl create secret generic api-secrets \
#     --from-literal=JWT_SECRET_KEY=your-secret \
#     -n sterna --dry-run=client -o yaml > secrets.yaml
#
# =============================================================================

---
# API Secrets - JWT and authentication
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/component: security
type: Opaque
stringData:
  # REQUIRED: JWT secret key (must match Django SECRET_KEY)
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"
  JWT_SECRET_KEY: "CHANGE_ME_generate_a_secure_64_char_random_string"

  # REQUIRED: Django secret key (should be same as JWT_SECRET_KEY for compatibility)
  SECRET_KEY: "CHANGE_ME_generate_a_secure_64_char_random_string"

  # REQUIRED: Field encryption key for OAuth tokens (Fernet key)
  # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  FIELD_ENCRYPTION_KEY: "CHANGE_ME_generate_fernet_key"

  # REQUIRED in prod (defaults to FIELD_ENCRYPTION_KEY): BYOK Fernet key
  # Encrypts User.openrouter_api_key. Independent rotation lets us
  # cycle BYOK keys without touching OAuth-token encryption.
  # See docs/operations/byok-key-rotation.md for the procedure.
  BYOK_ENCRYPTION_KEY: "CHANGE_ME_generate_fernet_key"

  # OPTIONAL: legacy keys for MultiFernet rotation (comma-separated).
  # Empty unless you are mid-rotation.
  BYOK_ENCRYPTION_KEY_LEGACY: ""

---
# Database Secrets - PostgreSQL/Neon connection
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # REQUIRED: Full database URL (for Django)
  # Format: postgresql://user:password@host:port/database?sslmode=require
  DATABASE_URL: "postgresql://user:password@host:5432/database?sslmode=require"

  # Individual components (for init containers)
  DB_HOST: "your-neon-host.neon.tech"
  DB_PORT: "5432"
  DB_USER: "your-db-user"
  DB_PASSWORD: "your-db-password"
  DB_NAME: "sterna"

---
# LLM Provider Secrets - API keys for AI providers
apiVersion: v1
kind: Secret
metadata:
  name: llm-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/component: llm
type: Opaque
stringData:
  # OpenRouter API key (primary LLM provider)
  OPENROUTER_API_KEY: "sk-or-v1-..."

  # Anthropic API key (for Claude models)
  ANTHROPIC_API_KEY: "sk-ant-..."

  # OpenAI API key (for GPT models and TTS)
  OPENAI_API_KEY: "sk-..."

  # ElevenLabs API key (for TTS)
  ELEVENLABS_API_KEY: "..."

  # Deepgram API key (for STT)
  DEEPGRAM_API_KEY: "..."

---
# Storage Secrets - Cloudflare R2 / S3-compatible storage
apiVersion: v1
kind: Secret
metadata:
  name: storage-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  # Cloudflare R2 credentials
  R2_ACCESS_KEY_ID: "..."
  R2_SECRET_ACCESS_KEY: "..."
  R2_BUCKET_NAME: "sternaway-storage"
  R2_ENDPOINT_URL: "https://your-account-id.r2.cloudflarestorage.com"

---
# External Services Secrets
apiVersion: v1
kind: Secret
metadata:
  name: external-services-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/component: external
type: Opaque
stringData:
  # Brave Search API key
  BRAVE_API_KEY: "BSA..."

  # Google OAuth (for user authentication)
  GOOGLE_CLIENT_ID: "...apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "GOCSPX-..."

  # GitHub OAuth (optional)
  GITHUB_CLIENT_ID: "..."
  GITHUB_CLIENT_SECRET: "..."

---
# Redis Secrets (if using external Redis)
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  # Redis URL (for managed Redis, e.g., Upstash)
  # Leave empty if using in-cluster Redis
  REDIS_URL: "redis://default:password@host:6379"

---
# Cloudflare Tunnel Secrets
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/component: ingress
type: Opaque
stringData:
  # Cloudflare Tunnel token
  # Get from: cloudflared tunnel token <tunnel-name>
  TUNNEL_TOKEN: "eyJ..."

---
