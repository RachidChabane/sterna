apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-maps
  namespace: sterna
  labels:
    app: google-maps
    app.kubernetes.io/name: google-maps
    app.kubernetes.io/component: maps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: google-maps
  template:
    metadata:
      labels:
        app: google-maps
        app.kubernetes.io/name: google-maps
    spec:
      serviceAccountName: google-maps
      containers:
        - name: google-maps
          image: ghcr.io/sterna-ai/google-maps:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          env:
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-services-secrets
                  key: GOOGLE_MAPS_API_KEY
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CACHE_TTL
              value: "86400"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: observability-secrets
                  key: SENTRY_DSN_MAPS
                  optional: true
          envFrom:
            - configMapRef:
                name: common-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
