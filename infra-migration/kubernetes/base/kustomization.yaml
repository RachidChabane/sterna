apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sterna

# Common labels for all resources
commonLabels:
  app.kubernetes.io/part-of: sterna
  app.kubernetes.io/managed-by: kustomize

resources:
  # Cluster-level resources
  - namespace.yaml
  # Note: sandboxes-namespace.yaml is applied separately (cluster-scoped, different namespace)
  - runtime-class.yaml

  # ConfigMaps and Secrets
  - configmaps/common.yaml
  # External Secrets Operator (fetches secrets from Scaleway Secret Manager)
  - external-secrets

  # Core services
  - api-gateway
  - web
  - frontend
  - orchestrator

  # Supporting services
  - redis
  - egress-proxy
  - brave-search
  - user-preferences
  - consigliere
  - google-maps

  # Background workers
  - celery-worker
  - celery-beat

  # Ingress
  - cloudflare-tunnel

  # Network policies
  - network-policies

  # Database backup and disaster recovery
  - backup

# Image tags can be overridden in overlays
# Note: consigliere, celery-worker, celery-beat all use the web image with different commands
images:
  - name: ghcr.io/sterna-ai/api-gateway
    newTag: latest
  - name: ghcr.io/sterna-ai/web
    newTag: latest
  - name: ghcr.io/sterna-ai/frontend
    newTag: latest
  - name: ghcr.io/sterna-ai/orchestrator
    newTag: latest
  - name: ghcr.io/sterna-ai/sandbox-datascience
    newTag: latest
  - name: ghcr.io/sterna-ai/egress-proxy
    newTag: latest
  - name: ghcr.io/sterna-ai/brave-search
    newTag: latest
  - name: ghcr.io/sterna-ai/user-preferences
    newTag: latest
  - name: ghcr.io/sterna-ai/google-maps
    newTag: latest
