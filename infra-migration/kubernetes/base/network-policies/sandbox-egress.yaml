# Allow sandboxes to only egress through the egress-proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress-only-via-proxy
  namespace: sterna-sandboxes
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow access to egress-proxy only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sterna
          podSelector:
            matchLabels:
              app: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
    # Allow access to orchestrator for health checks and API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sterna
          podSelector:
            matchLabels:
              app: orchestrator
      ports:
        - protocol: TCP
          port: 8000
