apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tunnel-to-services
  labels:
    app.kubernetes.io/part-of: sterna
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - frontend
          - api-gateway
          - web
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflare-tunnel
  policyTypes:
    - Ingress
