---
# Transactional Email Secrets (Resend) - Shared across environments
#
# IMPORTANT: DEFAULT_FROM_EMAIL must be on a Resend-verified domain.
# Verify sternaway.com in the Resend dashboard and configure:
#   - DKIM: CNAME records as printed by Resend
#   - SPF:  include:_spf.resend.com in TXT
#   - DMARC: v=DMARC1; p=none; rua=mailto:dmarc@sternaway.com   (neutral)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/name: email-secrets
    app.kubernetes.io/component: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: SecretStore
  target:
    name: email-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "name:sternaway-shared-email-secrets"

---
# CAPTCHA Secrets (Cloudflare Turnstile, task 19) - Shared across environments
#
# Scaleway secret payload (JSON):
#   {
#     "TURNSTILE_SITE_KEY":   "<from cloudflare turnstile dashboard>",
#     "TURNSTILE_SECRET_KEY": "<from cloudflare turnstile dashboard>"
#   }
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: turnstile-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/name: turnstile-secrets
    app.kubernetes.io/component: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: SecretStore
  target:
    name: turnstile-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "name:sternaway-shared-turnstile-secrets"

---
# Stripe billing secrets (task 11) - Shared across environments
#
# Scaleway secret payload (JSON):
#   {
#     "STRIPE_API_KEY":         "sk_test_…" (staging) / "sk_live_…" (prod),
#     "STRIPE_PUBLISHABLE_KEY": "pk_test_…" / "pk_live_…",
#     "STRIPE_WEBHOOK_SECRET":  "whsec_…"  (filled when task 13 ships;
#                                          empty until then)
#   }
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stripe-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/name: stripe-secrets
    app.kubernetes.io/component: billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: SecretStore
  target:
    name: stripe-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "name:sternaway-shared-stripe-secrets"

---
# Smoke-suite secrets (task 28) - Per-environment payload.
#
# Scaleway secret payload shape (per env):
#   {
#     "SMOKE_TEST_USER_PASSWORD":   "<16+ char string>",
#     "SMOKE_STRIPE_WEBHOOK_SECRET": "whsec_…" (test mode for staging,
#                                              live mode for prod; may
#                                              be empty in prod if no
#                                              safe event type — the
#                                              smoke test then skips)
#   }
#
# Both keys are consumed by:
#   - core/seed/management/commands/seed_smoke_user.py (reads
#     SMOKE_TEST_USER_PASSWORD from the pod env at seed_all time)
#   - core/smoke/tests/test_smoke.py (reads both at deploy-smoke time)
#
# The corresponding env entries in web/deployment.yaml both use
# `optional: true` so non-smoke environments roll out without blocking
# on these keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/name: smoke-secrets
    app.kubernetes.io/component: testing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: SecretStore
  target:
    name: smoke-secrets
    creationPolicy: Owner
  data:
    - secretKey: SMOKE_TEST_USER_PASSWORD
      remoteRef:
        key: "name:sternaway-staging-smoke-secrets"
        property: SMOKE_TEST_USER_PASSWORD
    - secretKey: SMOKE_STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: "name:sternaway-staging-smoke-secrets"
        property: SMOKE_STRIPE_WEBHOOK_SECRET
