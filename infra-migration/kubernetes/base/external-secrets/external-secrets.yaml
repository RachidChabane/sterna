# =============================================================================
# External Secrets - Synced from Scaleway Secret Manager
# =============================================================================
# These ExternalSecret resources fetch secrets from Scaleway and create
# corresponding Kubernetes secrets.

---
# API Secrets (JWT, Django SECRET_KEY, encryption keys)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/name: api-secrets
    app.kubernetes.io/component: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "name:sternaway-staging-api-secrets"

