# =============================================================================
# Scaleway Secret Store for External Secrets Operator
# =============================================================================
# This SecretStore connects to Scaleway Secret Manager to fetch secrets.
# The credentials are stored in a Kubernetes secret created by CI/CD.

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: scaleway-secret-store
  namespace: sterna
  labels:
    app.kubernetes.io/name: scaleway-secret-store
    app.kubernetes.io/component: secrets
spec:
  provider:
    scaleway:
      region: fr-par
      projectId: b6fc9f22-e39d-46ee-aaef-43366a64c7dd
      accessKey:
        secretRef:
          name: scaleway-credentials
          key: access-key
      secretKey:
        secretRef:
          name: scaleway-credentials
          key: secret-key
