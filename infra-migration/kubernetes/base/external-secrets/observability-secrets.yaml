# =============================================================================
# Observability Secrets - Sentry DSNs + Better Uptime tokens (task 21)
# =============================================================================
# Per-key `data:` (not `dataFrom: extract:` like the other manifests
# in this directory) so individual SENTRY_DSN_* keys can be absent
# from the Scaleway secret without failing reconcile. init_sentry
# no-ops when the DSN env var is unset, so absent keys are safe.

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: sterna
  labels:
    app.kubernetes.io/name: observability-secrets
    app.kubernetes.io/component: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: SecretStore
  target:
    name: observability-secrets
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN_WEB
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_DSN_WEB
    - secretKey: SENTRY_DSN_API_GATEWAY
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_DSN_API_GATEWAY
    - secretKey: SENTRY_DSN_ORCHESTRATOR
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_DSN_ORCHESTRATOR
    - secretKey: SENTRY_DSN_CONSIGLIERE
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_DSN_CONSIGLIERE
    - secretKey: SENTRY_DSN_BRAVE
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_DSN_BRAVE
    - secretKey: SENTRY_DSN_MAPS
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_DSN_MAPS
    - secretKey: SENTRY_DSN_USER_PREFS
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_DSN_USER_PREFS
    - secretKey: SENTRY_ALERTS_SLACK_WEBHOOK
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: SENTRY_ALERTS_SLACK_WEBHOOK
    - secretKey: BETTER_UPTIME_API_TOKEN
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: BETTER_UPTIME_API_TOKEN
    - secretKey: BETTER_UPTIME_SLACK_WEBHOOK
      remoteRef:
        key: name:sternaway-shared-observability-secrets
        property: BETTER_UPTIME_SLACK_WEBHOOK
