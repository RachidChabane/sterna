apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: sterna
  labels:
    app: celery-worker
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
        app.kubernetes.io/name: celery-worker
    spec:
      serviceAccountName: celery-worker
      containers:
        - name: celery-worker
          image: ghcr.io/sterna-ai/web:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - sterna
            - worker
            - -l
            - INFO
            - -Q
            - celery,code_jobs
            - --concurrency=4
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_SECRET_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: OPENAI_API_KEY
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: storage-secrets
                  key: R2_ACCESS_KEY_ID
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-secrets
                  key: R2_SECRET_ACCESS_KEY
                  optional: true
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: storage-secrets
                  key: R2_BUCKET_NAME
                  optional: true
            - name: R2_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: storage-secrets
                  key: R2_ENDPOINT
                  optional: true
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: storage-secrets
                  key: R2_ACCOUNT_ID
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: FRONTEND_URL
            - name: SITE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SITE_URL
            - name: ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: ALLOWED_HOSTS
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: RESEND_API_KEY
            - name: DEFAULT_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: DEFAULT_FROM_EMAIL
            - name: SUPPORT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: SUPPORT_EMAIL
                  optional: true
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secrets
                  key: STRIPE_API_KEY
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-secrets
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: observability-secrets
                  key: SENTRY_DSN_WEB
                  optional: true
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: web-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          # Celery worker health check via inspect ping
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - sterna
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: celery-worker
                topologyKey: kubernetes.io/hostname
