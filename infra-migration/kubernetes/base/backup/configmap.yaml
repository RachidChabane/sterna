# =============================================================================
# Backup Scripts ConfigMap
# =============================================================================
# Contains backup, validation, and alerting scripts for database DR
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: sterna
  labels:
    app.kubernetes.io/name: backup-scripts
    app.kubernetes.io/component: backup
data:
  # -------------------------------------------------------------------------
  # Database Backup Script
  # -------------------------------------------------------------------------
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    # Configuration
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="backup_${TIMESTAMP}.sql.gz"
    ENVIRONMENT="${ENVIRONMENT:-staging}"
    BACKUP_PATH="${ENVIRONMENT}/${BACKUP_FILE}"

    echo "[$(date)] Starting database backup..."
    echo "[$(date)] Environment: ${ENVIRONMENT}"
    echo "[$(date)] Backup file: ${BACKUP_FILE}"

    # Parse DATABASE_URL for pg_dump
    # Format: postgresql://user:password@host:port/database?sslmode=require
    DB_HOST=$(echo "$DATABASE_URL" | sed -E 's|.*@([^:]+):([0-9]+)/.*|\1|')
    DB_PORT=$(echo "$DATABASE_URL" | sed -E 's|.*@([^:]+):([0-9]+)/.*|\2|')
    DB_NAME=$(echo "$DATABASE_URL" | sed -E 's|.*/([^?]+).*|\1|')
    DB_USER=$(echo "$DATABASE_URL" | sed -E 's|.*://([^:]+):.*|\1|')
    DB_PASS=$(echo "$DATABASE_URL" | sed -E 's|.*://[^:]+:([^@]+)@.*|\1|')

    export PGPASSWORD="$DB_PASS"

    echo "[$(date)] Connecting to ${DB_HOST}:${DB_PORT}/${DB_NAME}..."

    # Create backup with compression
    pg_dump \
      -h "$DB_HOST" \
      -p "$DB_PORT" \
      -U "$DB_USER" \
      -d "$DB_NAME" \
      --format=plain \
      --no-owner \
      --no-acl \
      --verbose 2>&1 | gzip > "/tmp/${BACKUP_FILE}"

    BACKUP_SIZE=$(stat -f%z "/tmp/${BACKUP_FILE}" 2>/dev/null || stat -c%s "/tmp/${BACKUP_FILE}" 2>/dev/null)
    echo "[$(date)] Backup created: ${BACKUP_FILE} (${BACKUP_SIZE} bytes)"

    # Verify backup is not empty (minimum 100 bytes for a valid gzipped SQL)
    if [ "$BACKUP_SIZE" -lt 100 ]; then
      echo "[$(date)] ERROR: Backup file is too small, likely empty or corrupt"
      /scripts/alert.sh "Backup Failed" "Backup file is too small (${BACKUP_SIZE} bytes)"
      exit 1
    fi

    # Upload to R2
    echo "[$(date)] Uploading to R2: s3://${R2_BACKUP_BUCKET_NAME}/${BACKUP_PATH}"
    aws s3 cp "/tmp/${BACKUP_FILE}" "s3://${R2_BACKUP_BUCKET_NAME}/${BACKUP_PATH}" \
      --endpoint-url "${R2_ENDPOINT}"

    # Verify upload
    aws s3 ls "s3://${R2_BACKUP_BUCKET_NAME}/${BACKUP_PATH}" \
      --endpoint-url "${R2_ENDPOINT}" > /dev/null

    echo "[$(date)] Backup uploaded successfully"

    # Create latest pointer for easy access
    aws s3 cp "s3://${R2_BACKUP_BUCKET_NAME}/${BACKUP_PATH}" \
      "s3://${R2_BACKUP_BUCKET_NAME}/${ENVIRONMENT}/latest.sql.gz" \
      --endpoint-url "${R2_ENDPOINT}"

    echo "[$(date)] Updated latest.sql.gz pointer"

    # Cleanup
    rm -f "/tmp/${BACKUP_FILE}"

    echo "[$(date)] Backup completed successfully"

  # -------------------------------------------------------------------------
  # Backup Validation Script
  # -------------------------------------------------------------------------
  validate.sh: |
    #!/bin/bash
    set -euo pipefail

    ENVIRONMENT="${ENVIRONMENT:-staging}"
    BACKUP_PATH="${ENVIRONMENT}/latest.sql.gz"

    echo "[$(date)] Starting backup validation..."
    echo "[$(date)] Environment: ${ENVIRONMENT}"

    # Download latest backup
    echo "[$(date)] Downloading latest backup from R2..."
    aws s3 cp "s3://${R2_BACKUP_BUCKET_NAME}/${BACKUP_PATH}" "/tmp/latest.sql.gz" \
      --endpoint-url "${R2_ENDPOINT}"

    # Verify gzip integrity
    echo "[$(date)] Verifying gzip integrity..."
    if ! gzip -t "/tmp/latest.sql.gz"; then
      echo "[$(date)] ERROR: Backup file is corrupt (gzip check failed)"
      /scripts/alert.sh "Backup Validation Failed" "Gzip integrity check failed for ${BACKUP_PATH}"
      exit 1
    fi

    # Decompress and check SQL structure
    echo "[$(date)] Checking SQL structure..."
    gunzip -c "/tmp/latest.sql.gz" > "/tmp/latest.sql"

    # Check for essential PostgreSQL commands
    REQUIRED_PATTERNS=("CREATE TABLE" "SET" "COPY")
    for pattern in "${REQUIRED_PATTERNS[@]}"; do
      if ! grep -q "$pattern" "/tmp/latest.sql"; then
        echo "[$(date)] ERROR: Backup missing required pattern: $pattern"
        /scripts/alert.sh "Backup Validation Failed" "Backup missing required SQL pattern: $pattern"
        exit 1
      fi
    done

    # Get backup info
    BACKUP_SIZE=$(stat -f%z "/tmp/latest.sql.gz" 2>/dev/null || stat -c%s "/tmp/latest.sql.gz" 2>/dev/null)
    UNCOMPRESSED_SIZE=$(stat -f%z "/tmp/latest.sql" 2>/dev/null || stat -c%s "/tmp/latest.sql" 2>/dev/null)
    TABLE_COUNT=$(grep -c "CREATE TABLE" "/tmp/latest.sql" || echo "0")

    echo "[$(date)] Backup stats:"
    echo "[$(date)]   Compressed size: ${BACKUP_SIZE} bytes"
    echo "[$(date)]   Uncompressed size: ${UNCOMPRESSED_SIZE} bytes"
    echo "[$(date)]   Table count: ${TABLE_COUNT}"

    # Sanity check: should have at least a few tables
    if [ "$TABLE_COUNT" -lt 5 ]; then
      echo "[$(date)] WARNING: Backup has fewer than 5 tables (found: ${TABLE_COUNT})"
      /scripts/alert.sh "Backup Validation Warning" "Backup has only ${TABLE_COUNT} tables, expected more"
    fi

    # Cleanup
    rm -f "/tmp/latest.sql.gz" "/tmp/latest.sql"

    echo "[$(date)] Backup validation completed successfully"

  # -------------------------------------------------------------------------
  # Alert Script
  # -------------------------------------------------------------------------
  alert.sh: |
    #!/bin/bash
    set -euo pipefail

    TITLE="${1:-Backup Alert}"
    MESSAGE="${2:-An issue occurred with the backup system}"
    ENVIRONMENT="${ENVIRONMENT:-staging}"

    # Skip if no webhook URL configured
    if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
      echo "[$(date)] WARNING: SLACK_WEBHOOK_URL not set, skipping alert"
      echo "[$(date)] Alert would have been: ${TITLE} - ${MESSAGE}"
      exit 0
    fi

    # Build Slack message payload
    PAYLOAD=$(cat <<EOF
    {
      "attachments": [
        {
          "color": "danger",
          "title": ":warning: ${TITLE}",
          "text": "${MESSAGE}",
          "fields": [
            {
              "title": "Environment",
              "value": "${ENVIRONMENT}",
              "short": true
            },
            {
              "title": "Timestamp",
              "value": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "short": true
            }
          ],
          "footer": "Sterna Backup System"
        }
      ]
    }
    EOF
    )

    # Send to Slack
    curl -s -X POST -H 'Content-type: application/json' \
      --data "$PAYLOAD" \
      "$SLACK_WEBHOOK_URL" > /dev/null

    echo "[$(date)] Alert sent to Slack: ${TITLE}"
