[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-k8s"
version = "1.0.0"
description = "Kubernetes-based sandbox executor for Sterna AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "kubernetes>=28.1.0",
    "aiohttp>=3.9.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sandbox_k8s"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
